name: Docker Image

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/hughryu/signmate

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build-and-push:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SIGNMATE_VERSION=${{ steps.identity.outputs.version }}
            SIGNMATE_GIT_COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Verify manifest and promote stable
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' manifest.json
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker buildx imagetools create -t "$IMAGE_NAME:latest" "$IMAGE_NAME@$DIGEST"
            docker buildx imagetools inspect "$IMAGE_NAME:latest" --raw > stable.json
            cmp manifest.json stable.json
          fi
          echo "$IMAGE_NAME@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
